<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Gezi logo concepts</title>
  <desc id="desc">Three green-only geometric Gezi logo directions shown side by side.</desc>
  <rect width="1440" height="760" fill="#F6F8F7"/>
  <text x="80" y="82" fill="#101418" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="2">GEZI AI · LOGO DIRECTIONS</text>
  <text x="80" y="122" fill="#4A5560" font-family="Inter, Arial, sans-serif" font-size="18">Founder review · green-led identity · gold intentionally excluded</text>
  <g transform="translate(64 168)">
    <rect width="416" height="500" rx="8" fill="#fff" stroke="#E2E8E5"/>
    <text x="32" y="50" fill="#0E6B4A" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="1.4">01 · RISING LOOP</text>
    <text x="32" y="78" fill="#4A5560" font-family="Inter, Arial, sans-serif" font-size="15">g + upward chevron, direct and confident</text>
    <g transform="translate(160 142) scale(1.65)">
      <path fill="#0E6B4A" d="M48.3 8.2 40 16.5l-8.3-8.3-5.1 5.1L40 26.7l13.4-13.4z"/>
      <path fill="#0E6B4A" d="M47.7 29.1v12.1c0 7.4-4.8 12.3-12.6 12.3-7.6 0-13.2-5.3-13.2-13s5.6-13.1 13.2-13.1c4.5 0 8.1 1.7 10.8 4.9l5.5-5.4c-4-4.8-9.4-7.2-16.5-7.2C22.1 19.7 14 28.1 14 40.5S22.1 61 34.9 61c13.2 0 20.8-7.9 20.8-20.4V29.1z"/>
      <path fill="#fff" d="M35.1 36.2h20.6v6.3H35.1z"/>
    </g>
    <path fill="#0E6B4A" d="M92 386 100 378l8 8-8 8z"/>
    <text x="124" y="394" fill="#0E6B4A" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="3">gezi</text>
    <text x="32" y="452" fill="#4A5560" font-family="Inter, Arial, sans-serif" font-size="14">Recommended default</text>
  </g>
  <g transform="translate(512 168)">
    <rect width="416" height="500" rx="8" fill="#fff" stroke="#E2E8E5"/>
    <text x="32" y="50" fill="#0E6B4A" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="1.4">02 · OPEN ORBIT</text>
    <text x="32" y="78" fill="#4A5560" font-family="Inter, Arial, sans-serif" font-size="15">open g ring with a rising terminal</text>
    <g transform="translate(151 140)">
      <path fill="none" stroke="#0E6B4A" stroke-width="16" stroke-linecap="round" d="M122 55v56c0 39-25 64-66 64-39 0-68-27-68-67s29-68 68-68c24 0 43 9 57 25"/>
      <path fill="#0E6B4A" d="m87 27 27-27 27 27-13 13-14-14-14 14z"/>
      <path fill="#fff" d="M49 97h76v16H49z"/>
    </g>
    <text x="96" y="394" fill="#0E6B4A" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="3">gezi</text>
    <text x="32" y="452" fill="#4A5560" font-family="Inter, Arial, sans-serif" font-size="14">More editorial, more open</text>
  </g>
  <g transform="translate(960 168)">
    <rect width="416" height="500" rx="8" fill="#fff" stroke="#E2E8E5"/>
    <text x="32" y="50" fill="#0E6B4A" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="1.4">03 · BUILT ARROW</text>
    <text x="32" y="78" fill="#4A5560" font-family="Inter, Arial, sans-serif" font-size="15">modular g built from a single ascending cut</text>
    <g transform="translate(155 144)">
      <path fill="#0E6B4A" d="M0 118V30h20v68h64V30h20v88z"/>
      <path fill="#0E6B4A" d="m58 54 32-32 32 32-14 14-18-18-18 18z"/>
      <path fill="#fff" d="M43 74h45v18H43z"/>
    </g>
    <text x="96" y="394" fill="#0E6B4A" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="3">gezi</text>
    <text x="32" y="452" fill="#4A5560" font-family="Inter, Arial, sans-serif" font-size="14">Most modular at small sizes</text>
  </g>
